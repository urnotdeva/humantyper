[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coding-operator"
version = "0.1.0"
description = "Cursor-brain + Human Typer-hands local coding operator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pynput>=1.7.6",
  "mcp>=1.0.0,<2",
]

[project.optional-dependencies]
linux = ["evdev>=1.6.0"]
dev = ["pytest>=7.0"]

[project.scripts]
ai-coding-operator = "coding_operator.gui:main"
ai-coding-operator-daemon = "coding_operator.daemon:main"
ai-coding-operator-start = "coding_operator.start:main"
ai-coding-operator-install = "cursor_integration.install:main"
ai-coding-operator-doctor = "coding_operator.doctor:main"
human-typer-mcp = "mcp_server.server:main"

[tool.setuptools.packages.find]
include = ["human_typer*", "coding_operator*", "mcp_server*", "cursor_integration*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
